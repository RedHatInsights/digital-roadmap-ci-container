name: Build and push container image

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
    contents: read

jobs:
  build-and-push:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Login to Quay.io
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USER }}
          password: ${{ secrets.QUAY_TOKEN }}

      - name: Sanitize image tag
        id: image-tag
        env:
          REF_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          tag=$(printf '%s' "$REF_NAME" | sed -E 's/[^A-Za-z0-9_.-]+/-/g; s/^[.-]+//; s/[.-]+$//')
          tag=${tag:0:128}
          if [ -z "$tag" ]; then
            echo "Ref name '$REF_NAME' cannot be turned into a Docker tag" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294 # v7.0.0
        with:
          context: .
          file: Containerfile
          platforms: linux/arm64,linux/amd64
          provenance: false
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            quay.io/lightspeed-planning/digital-roadmap-ci-container:latest
            quay.io/lightspeed-planning/digital-roadmap-ci-container:${{ steps.image-tag.outputs.tag }}
